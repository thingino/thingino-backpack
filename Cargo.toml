[package]
name = "thingino-backpack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "backpack"
path = "src/main.rs"
harness = false

# Detect, bootstrap and read a camera with no network; `--features verify-uboot` adds the
# DDR readback of U-Boot before the jump.
[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"
harness = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
debug = true
opt-level = "z"

[features]
# Read U-Boot back out of DDR through the bootrom before the jump (adds ~10 s).
verify-uboot = []

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"
sha2 = "0.10"
tdfu-core = { path = "../thingino-dfu-rs-espidf/crates/tdfu-core" }
tdfu-usb = { path = "../thingino-dfu-rs-espidf/crates/tdfu-usb" }
tdfu-daemon = { path = "../thingino-dfu-rs-espidf/crates/tdfu-daemon" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "macros"] }
# The USB backend and the daemon log through tracing; with no subscriber installed, its
# `log` feature hands their events to the ESP logger.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }

[build-dependencies]
embuild = "0.33"

# Espressif's mDNS responder, a managed component since ESP-IDF 5.0, fetched from the
# component registry at build time.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8" }
